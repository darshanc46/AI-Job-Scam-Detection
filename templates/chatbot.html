<div class="chatbot">
    <div class="chatbox" id="chatBox">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="margin:0; color:#fff;"><i class="fa-solid fa-robot text-primary"></i> JobShyld NLU Chatbot</h3>
            <button onclick="toggleChatbot()" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer; width:auto; padding:0;">&times;</button>
        </div>
        <p style="font-size:12px; color:#94a3b8; margin-bottom:12px;">Ask any question regarding offer letters, chat interviews, or upfront fees:</p>
        
        <div id="chatHistory" style="max-height:200px; overflow-y:auto; margin-bottom:12px; font-size:13px; display:flex; flex-direction:column; gap:8px;"></div>

        <div style="display:grid; gap:6px; margin-bottom:12px;">
            <button onclick="askAdvisor('Is Telegram interview safe?')" class="quick-ask">📲 Is Telegram hiring legit?</button>
            <button onclick="askAdvisor('Registration fee required for job')" class="quick-ask">💳 Upfront Fee Demand Check</button>
            <button onclick="askAdvisor('Check deposit equipment scam')" class="quick-ask">📦 Laptop Check Deposit Scam</button>
            <button onclick="askAdvisor('How to verify recruiter domain email')" class="quick-ask">🔍 Recruiter Email Verification</button>
        </div>

        <div style="display:flex; gap:6px;">
            <input type="text" id="chatInput" placeholder="Type your security question..." style="padding:8px 12px; font-size:13px;" onkeypress="if(event.key==='Enter') sendChatInput()">
            <button onclick="sendChatInput()" style="width:auto; padding:8px 14px; margin:0; background:var(--accent); color:#070d19;"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
    <button id="chatBtn" onclick="toggleChatbot()" title="Ask AI Security Advisor">
        <i class="fa-solid fa-robot"></i>
    </button>
</div>

<script>
    function toggleChatbot() {
        const box = document.getElementById("chatBox");
        box.classList.toggle("show");
    }

    async function askAdvisor(question) {
        const history = document.getElementById("chatHistory");
        history.innerHTML += `<div style="background:rgba(2,132,199,0.25); color:#fff; padding:8px 12px; border-radius:10px; align-self:flex-end; max-width:85%;"><b>You:</b> ${question}</div>`;
        history.scrollTop = history.scrollHeight;

        try {
            const res = await fetch('/api/advisor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            history.innerHTML += `<div style="background:#1e293b; color:#e2e8f0; padding:8px 12px; border-radius:10px; align-self:flex-start; line-height:1.5; max-width:90%; border:1px solid rgba(255,255,255,0.08);">${data.reply}</div>`;
            history.scrollTop = history.scrollHeight;
        } catch (e) {
            history.innerHTML += `<div style="color:#f87171;">Failed to connect to AI Advisor.</div>`;
        }
    }

    function sendChatInput() {
        const input = document.getElementById("chatInput");
        const q = input.value.trim();
        if (q) {
            askAdvisor(q);
            input.value = "";
        }
    }
</script>
