<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobShyld AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="auth-page">

    <div class="login-box">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-area" style="margin-bottom:18px;padding:14px 18px;background:#fff3cd;border:1px solid #ffeeba;color:#856404;border-radius:8px;">
                    {% for message in messages %}
                        <p style="margin:0 0 6px;">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <div style="text-align:center; font-size:56px; color:var(--accent); margin-bottom:12px;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Welcome Back 👋</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:28px; font-size:14px;">
            Sign in to access AI scam detection history and profile
        </p>

        <form action="/login" method="POST">
            <div style="margin-bottom:16px;">
                <input type="email" name="email" placeholder="Enter Email Address" required>
            </div>
            <div class="password-box" style="margin-bottom:24px;">
                <input type="password" name="password" id="password" placeholder="Enter Password" required>
                <i class="fa-solid fa-eye" onclick="togglePassword()"></i>
            </div>
            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i> Secure Login
            </button>
        </form>

        <div style="text-align:center; margin-top:28px; font-size:14px; color:var(--text-body);">
            Don't have an account? <a href="/register" style="color:var(--accent); font-weight:600;">Register Now</a>
        </div>
        <div style="text-align:center; margin-top:16px; font-size:14px;">
            <a href="/" style="color:var(--text-muted); transition:color 0.2s;">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        function togglePassword(){
            let pass = document.getElementById("password");
            pass.type = pass.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
